<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7fb">
  <title>Sign in</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(ellipse at 12% 10%, rgba(120, 139, 255, 0.13), transparent 34%),
        radial-gradient(ellipse at 92% 88%, rgba(66, 197, 173, 0.12), transparent 32%),
        #f5f7fb;
    }

    .login-card {
      width: min(100%, 440px);
      padding: 44px;
      border: 1px solid #e8ebf2;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(27, 39, 72, 0.1);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 34px;
      color: #172033;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      background: #5368e8;
      color: #fff;
      font-size: 19px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 34px);
      letter-spacing: -0.045em;
    }

    .intro {
      margin: 10px 0 30px;
      color: #697386;
      font-size: 15px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 20px;
    }

    .field-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    label {
      font-size: 13px;
      font-weight: 650;
    }

    .field a,
    .signup a {
      color: #5368e8;
      font-size: 13px;
      font-weight: 650;
      text-decoration: none;
    }

    .field a:hover,
    .signup a:hover {
      text-decoration: underline;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 0 14px;
      border: 1px solid #dfe3eb;
      border-radius: 9px;
      outline: none;
      background: #fff;
      color: #172033;
      font: inherit;
      font-size: 14px;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    input::placeholder {
      color: #a0a8b7;
    }

    input:focus {
      border-color: #6879ed;
      box-shadow: 0 0 0 3px rgba(83, 104, 232, 0.14);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 68px;
    }

    .show-password {
      position: absolute;
      top: 50%;
      right: 12px;
      padding: 6px;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #687386;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
    }

    .show-password:focus-visible,
    .remember input:focus-visible,
    .submit:focus-visible {
      outline: 3px solid rgba(83, 104, 232, 0.35);
      outline-offset: 2px;
    }

    .remember {
      display: flex;
      width: fit-content;
      align-items: center;
      gap: 9px;
      margin: 2px 0 24px;
      color: #515c70;
      cursor: pointer;
      font-size: 13px;
    }

    .remember input {
      width: 16px;
      min-height: 16px;
      margin: 0;
      accent-color: #5368e8;
    }

    .submit {
      width: 100%;
      min-height: 49px;
      border: 0;
      border-radius: 9px;
      background: #5368e8;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      transition: background 150ms ease, transform 150ms ease;
    }

    .submit:hover {
      transform: translateY(-1px);
      background: #4358d4;
    }

    .signup {
      margin: 24px 0 0;
      color: #697386;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand" aria-label="hammalathu">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span>hammalathu</span>
    </div>

    <h1>Welcome back</h1>
    <p class="intro">Sign in to your account to continue.</p>

    <form action="#" method="post">
      <div class="field">
        <div class="field-header">
          <label for="email">Email address</label>
        </div>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <div class="field-header">
          <label for="password">Password</label>
          <a href="#">Forgot password?</a>
        </div>
        <div class="password-wrap">
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
          <button class="show-password" type="button" aria-controls="password" aria-pressed="false">
            Show
          </button>
        </div>
      </div>

      <label class="remember">
        <input type="checkbox" name="remember">
        <span>Remember me</span>
      </label>

      <button class="submit" type="submit">Sign in</button>
    </form>

    <p class="signup">Don't have an account? <a href="#">Create account</a></p>
  </main>

  <script>
    const passwordInput = document.querySelector("#password");
    const passwordToggle = document.querySelector(".show-password");

    passwordToggle.addEventListener("click", () => {
      const isVisible = passwordInput.type === "text";
      passwordInput.type = isVisible ? "password" : "text";
      passwordToggle.textContent = isVisible ? "Show" : "Hide";
      passwordToggle.setAttribute("aria-pressed", String(!isVisible));
    });
  </script>
</body>
</html>
